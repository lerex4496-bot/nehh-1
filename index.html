<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- CONFIGURATION ---
    const CONFIG = {
      herName: "My Dearest",
      myName: "Me",
      duration: "almost 5 years",
      whatsAppNumber: "919106764653", // Updated India code (+91) with 9106764653
      whatsAppMessage: "Hey... I finished reading the website. Let's talk properly. ❤️",
      photos: [
        {
          caption: "When everything felt effortless",
          url: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=600&q=80"
        },
        {
          caption: "The laughter that made all the noise fade away",
          url: "https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?auto=format&fit=crop&w=600&q=80"
        },
        {
          caption: "A quiet moment I still hold onto",
          url: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=600&q=80"
        }
      ]
    };

    // --- AMBIENT SOUND GENERATOR ---
    class AmbientChords {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.timer = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }
      playChord(freqs, time, duration) {
        freqs.forEach(freq => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, time);

          gain.gain.setValueAtTime(0, time);
          gain.gain.linearRampToValueAtTime(0.025, time + 1.8);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(time);
          osc.stop(time + duration);
        });
      }
      start() {
        this.init();
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        this.isPlaying = true;
        
        const progression = [
          [174.61, 220.00, 261.63, 329.63], // F, A, C, E
          [130.81, 196.00, 246.94, 329.63], // C, G, B, E
          [146.83, 220.00, 261.63, 293.66], // D, A, C, D
          [116.54, 174.61, 233.08, 293.66]  // Bb, F, Bb, D
        ];
        
        let index = 0;
        const loop = () => {
          if (!this.isPlaying) return;
          const now = this.ctx.currentTime;
          this.playChord(progression[index % progression.length], now, 6.5);
          index++;
          this.timer = setTimeout(loop, 4500);
        };
        loop();
      }
      stop() {
        this.isPlaying = false;
        if (this.timer) clearTimeout(this.timer);
      }
    }

    const ambientAudio = new AmbientChords();

    // --- CANVAS PARTICLES & BUTTERFLIES ---
    const CanvasBackground = ({ isDark }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const particles = Array.from({ length: 26 }).map(() => ({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 2.5 + 1.2,
          speedY: Math.random() * 0.4 + 0.2,
          speedX: Math.sin(Math.random() * Math.PI * 2) * 0.3,
          alpha: Math.random() * 0.4 + 0.2,
          color: Math.random() > 0.4 ? '#fca5b9' : '#d5bbf9'
        }));

        const butterflies = Array.from({ length: 4 }).map(() => ({
          x: Math.random() * width,
          y: Math.random() * height,
          wingSpan: 10 + Math.random() * 6,
          flutterSpeed: 0.15 + Math.random() * 0.1,
          flutterPhase: Math.random() * Math.PI,
          vx: 0.4 + Math.random() * 0.4,
          vy: (Math.random() - 0.5) * 0.5
        }));

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          particles.forEach((p) => {
            p.y += p.speedY;
            p.x += Math.sin(p.y * 0.01) * 0.4;
            if (p.y > height) {
              p.y = -10;
              p.x = Math.random() * width;
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = isDark ? p.alpha * 0.8 : p.alpha * 0.5;
            ctx.fill();
          });

          butterflies.forEach((b) => {
            b.x += b.vx;
            b.y += Math.sin(b.x * 0.02) * 0.8 + b.vy;
            b.flutterPhase += b.flutterSpeed;

            if (b.x > width + 30) {
              b.x = -30;
              b.y = Math.random() * (height * 0.8);
            }

            const wingScale = Math.sin(b.flutterPhase);

            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(Math.sin(b.x * 0.02) * 0.2);

            ctx.fillStyle = isDark ? "rgba(254, 205, 225, 0.65)" : "rgba(236, 72, 116, 0.45)";
            ctx.globalAlpha = 0.7;

            ctx.beginPath();
            ctx.ellipse(-b.wingSpan * 0.5 * Math.abs(wingScale), 0, b.wingSpan * 0.6 * Math.abs(wingScale), b.wingSpan * 0.4, -0.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(b.wingSpan * 0.5 * Math.abs(wingScale), 0, b.wingSpan * 0.6 * Math.abs(wingScale), b.wingSpan * 0.4, 0.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, [isDark]);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-0"
        />
      );
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [step, setStep] = useState(0);
      const [musicOn, setMusicOn] = useState(false);

      // Branch states
      const [forgiveChoice, setForgiveChoice] = useState(null);
      const [q1Answer, setQ1Answer] = useState(null);
      const [q2Answer, setQ2Answer] = useState(null);
      const [tryChoice, setTryChoice] = useState(null);
      const [proposalChoice, setProposalChoice] = useState(null);
      const [meetChoice, setMeetChoice] = useState(null);
      const [waChoice, setWaChoice] = useState(null);

      const toggleMusic = () => {
        if (!musicOn) {
          ambientAudio.start();
          setMusicOn(true);
        } else {
          ambientAudio.stop();
          setMusicOn(false);
        }
      };

      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const nextStep = () => {
        setStep(prev => prev + 1);
        scrollToTop();
      };

      const isDarkMode = step === 8;

      return (
        <div className={`min-h-screen relative flex flex-col font-sans transition-colors duration-1000 ${isDarkMode ? 'bg-[#0f0914] text-[#f8e9ee]' : 'bg-gradient-to-br from-blush-50 via-cream-50 to-lavender-100 text-[#372b33]'}`}>
          <CanvasBackground isDark={isDarkMode} />

          {/* Top subtle controls bar (music only) */}
          <header className="relative z-20 flex justify-between items-center px-5 py-4 max-w-md mx-auto w-full">
            <div className="flex items-center space-x-2">
              <span className="font-handwritten text-xl text-blush-500 font-bold tracking-wide">
                {step > 0 ? "with love & honesty" : "a gentle note"}
              </span>
            </div>

            <div className="flex items-center space-x-2">
              <button
                onClick={toggleMusic}
                aria-label="Ambient music"
                className={`p-2.5 rounded-full text-xs flex items-center gap-1.5 transition-all ${
                  musicOn
                    ? 'bg-blush-400 text-white shadow-md'
                    : isDarkMode 
                      ? 'bg-white/10 text-pink-200 hover:bg-white/20' 
                      : 'bg-white/80 text-gray-600 hover:bg-white shadow-sm'
                }`}
              >
                <span>{musicOn ? '🎵' : '🔇'}</span>
                <span className="text-[11px] font-medium hidden sm:inline">
                  {musicOn ? 'Soft Sound On' : 'Soft Sound'}
                </span>
              </button>
            </div>
          </header>

          {/* Progress hint for sections (1 through 9) */}
          {step > 0 && step < 10 && (
            <div className="relative z-10 w-full max-w-md mx-auto px-6 mb-2">
              <div className="h-1 w-full bg-black/5 rounded-full overflow-hidden">
                <div 
                  className="h-full bg-gradient-to-r from-blush-300 to-blush-500 transition-all duration-700"
                  style={{ width: `${(step / 9) * 100}%` }}
                />
              </div>
            </div>
          )}

          {/* Main content container */}
          <main className="relative z-10 flex-1 flex flex-col justify-center items-center px-4 py-4 w-full max-w-md mx-auto">
            {step === 0 && (
              <LandingScreen onOpen={() => nextStep()} />
            )}

            {step === 1 && (
              <SectionApology
                forgiveChoice={forgiveChoice}
                setForgiveChoice={setForgiveChoice}
                onContinue={nextStep}
              />
            )}

            {step === 2 && (
              <SectionWhatIMeant onContinue={nextStep} />
            )}

            {step === 3 && (
              <SectionTimeline
                config={CONFIG}
                onContinue={nextStep}
              />
            )}

            {step === 4 && (
              <SectionInteractive
                q1={q1Answer}
                setQ1={setQ1Answer}
                q2={q2Answer}
                setQ2={setQ2Answer}
                onContinue={nextStep}
              />
            )}

            {step === 5 && (
              <SectionPromises onContinue={nextStep} />
            )}

            {step === 6 && (
              <SectionWantToTry
                choice={tryChoice}
                setChoice={setTryChoice}
                onContinue={nextStep}
              />
            )}

            {step === 7 && (
              <SectionTheRealProblem onContinue={nextStep} />
            )}

            {step === 8 && (
              <SectionFinalProposal
                choice={proposalChoice}
                setChoice={setProposalChoice}
                onContinue={nextStep}
              />
            )}

            {step === 9 && (
              <SectionFinalScreen
                config={CONFIG}
                meetChoice={meetChoice}
                setMeetChoice={setMeetChoice}
                waChoice={waChoice}
                setWaChoice={setWaChoice}
                onRestart={() => {
                  setStep(0);
                  setForgiveChoice(null);
                  setTryChoice(null);
                  setProposalChoice(null);
                  setMeetChoice(null);
                  setWaChoice(null);
                }}
              />
            )}
          </main>

          {/* Discreet footer */}
          <footer className="relative z-10 text-center py-4 text-xs opacity-50">
            <span>Made with all my heart ❤️</span>
          </footer>
        </div>
      );
    }

    // ==========================================
    // STEP 0: LANDING SCREEN
    // ==========================================
    function LandingScreen({ onOpen }) {
      const [opening, setOpening] = useState(false);

      const handleOpen = () => {
        setOpening(true);
        setTimeout(() => {
          onOpen();
        }, 650);
      };

      return (
        <div className={`w-full text-center transition-all duration-700 ${opening ? 'opacity-0 scale-95' : 'opacity-100 scale-100'}`}>
          <div className="glass-card rounded-3xl p-8 py-10 shadow-xl border border-white/60 relative overflow-hidden">
            <div className="inline-block p-4 rounded-full bg-blush-100/60 mb-5 heart-glow">
              <span className="text-4xl">🦋</span>
            </div>

            <h1 className="font-handwritten text-5xl sm:text-6xl text-blush-500 font-bold mb-3 tracking-wide">
              Hey... ❤️
            </h1>

            <p className="font-serif text-2xl text-gray-700 italic mb-6">
              I made something for you.
            </p>

            <div className="space-y-2 text-sm text-gray-600 leading-relaxed font-normal mb-8 px-2">
              <p>Not to win an argument.</p>
              <p>Not to prove that I&apos;m right.</p>
              <p className="font-medium text-gray-800 pt-1">
                Just to say something I should have said properly.
              </p>
            </div>

            <button
              onClick={handleOpen}
              className="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-blush-400 to-blush-500 hover:from-blush-500 hover:to-blush-600 text-white font-medium shadow-md shadow-blush-300/40 hover:shadow-lg transition-all duration-300 active:scale-[0.98] flex items-center justify-center gap-2 text-base"
            >

              <span className="text-lg">🦋</span>
            </button>

    }

    // ==========================================
    // STEP 1: THE APOLOGY
    // ==========================================
    function SectionApology({ forgiveChoice, setForgiveChoice, onContinue }) {
      return (
        <div className="w-full">
          <div className="glass-card rounded-3xl p-6 sm:p-8 shadow-xl">
            <div className="flex items-center gap-2 mb-4">
              <span className="text-blush-400 text-xl">✨</span>
              <h2 className="font-handwritten text-4xl text-blush-500 font-bold">
                First, I&apos;m sorry.
              </h2>
            </div>

            <div className="text-gray-700 leading-relaxed space-y-3.5 text-sm sm:text-base font-normal">
              <p className="font-semibold text-gray-900 text-base">
                I know I messed up.
              </p>
              <div className="pl-3 border-l-2 border-blush-200 space-y-1 text-gray-600 italic">
                <p>I was insecure.</p>
                <p>I was scared.</p>
                <p>I had too many doubts in my head.</p>
              </div>
              <p>
                But none of that gives me the right to take your phone, take your SIM, repeatedly question you, or make you feel like you have to prove yourself to me.
              </p>
              <div className="space-y-1.5 py-1 text-gray-800 font-medium">
                <p>• You deserve trust.</p>
                <p>• You deserve your own space.</p>
                <p>• You deserve to feel safe with me.</p>
              </div>
              <p className="text-blush-500 font-medium pt-1">
                I&apos;m genuinely sorry for making you feel otherwise.
              </p>
            </div>

            {forgiveChoice === null && (
              <div className="mt-8 pt-4 border-t border-blush-100">
                <p className="text-center font-serif text-lg text-gray-700 italic mb-4">
                  Do you forgive me?
                </p>
                <div className="grid grid-cols-2 gap-3">
                  <button
                    onClick={() => setForgiveChoice('yes')}
                    className="py-3 px-4 rounded-xl bg-blush-400 hover:bg-blush-500 text-white font-medium text-sm transition-all shadow-sm active:scale-95"
                  >
                    Yes ❤️
                  </button>
                  <button
                    onClick={() => setForgiveChoice('not-yet')}
                    className="py-3 px-4 rounded-xl bg-white hover:bg-gray-50 border border-gray-200 text-gray-700 font-medium text-sm transition-all active:scale-95"
                  >
                    Not yet
                  </button>
                </div>
              </div>
            )}

            {forgiveChoice === 'yes' && (
              <div className="mt-6 p-4 rounded-2xl bg-blush-50 border border-blush-200 animate-fadeIn">
                <div className="flex items-center gap-2 mb-2 text-blush-500">
                  <span>🦋</span>
                  <p className="font-handwritten text-2xl font-bold">Thank you.</p>
                </div>
                <p className="text-sm text-gray-700 leading-relaxed mb-4">
                  Forgiveness doesn&apos;t mean everything magically becomes okay. I want to earn your trust again through what I do — not just what I say.
                </p>
                <button
                  onClick={onContinue}
                  className="w-full py-2.5 rounded-xl bg-blush-400 text-white font-medium text-sm shadow-sm flex items-center justify-center gap-1.5"
                >
                  <span>Keep going</span>
                  <span>🦋</span>
                </button>
              </div>
            )}

            {forgiveChoice === 'not-yet' && (
              <div className="mt-6 p-4 rounded-2xl bg-lavender-50 border border-lavender-200 animate-fadeIn">
                <p className="font-handwritten text-2xl font-bold text-gray-800 mb-1">
                  That&apos;s okay.
                </p>
                <p className="text-xs text-blush-500 uppercase tracking-widest font-semibold mb-2">
                  I won&apos;t force you.
                </p>
                <p className="text-sm text-gray-700 leading-relaxed mb-4">
                  If you&apos;re angry, hurt, confused, or simply need time, you have every right to feel that way. Can I still tell you what I&apos;ve been unable to say properly?
                </p>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={onContinue}
                    className="py-2.5 px-3 rounded-xl bg-blush-400 text-white font-medium text-xs shadow-sm hover:bg-blush-500"
                  >
                    Okay, tell me
                  </button>
                  <button
                    onClick={() => setForgiveChoice('space')}
                    className="py-2.5 px-3 rounded-xl bg-white border border-gray-200 text-gray-600 font-medium text-xs"
                  >
                    I need space
                  </button>
                </div>
              </div>
            )}

            {forgiveChoice === 'space' && (
              <div className="mt-6 p-5 rounded-2xl bg-cream-100 border border-cream-200 text-center animate-fadeIn">
                <p className="font-handwritten text-2xl text-gray-800 font-bold mb-2">
                  Then take your space.
                </p>
                <p className="text-sm text-gray-600 leading-relaxed mb-4">
                  I won&apos;t turn my apology into pressure. Whenever you&apos;re ready, I&apos;ll still be here.
                </p>
                <p className="text-xs text-blush-400 italic">
                  Come back when you&apos;re ready ❤️
                </p>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // STEP 2: WHAT I REALLY MEANT
    // ==========================================
    function SectionWhatIMeant({ onContinue }) {
      return (
        <div className="w-full">
          <div className="glass-card rounded-3xl p-6 sm:p-8 shadow-xl">
            <h2 className="font-handwritten text-3xl sm:text-4xl text-blush-500 font-bold mb-4 leading-tight">
              I wasn&apos;t trying to control you... but I understand that I did.
            </h2>

            <div className="text-gray-700 text-sm sm:text-base leading-relaxed space-y-4 font-normal">
              <p>
                When I took your phone and SIM, my intention in my head was that I wanted answers.
              </p>

              <div className="bg-blush-50/70 p-3.5 rounded-xl border border-blush-100 space-y-1 text-sm text-gray-700">
                <p>• I wanted you to talk.</p>
                <p>• I wanted to understand what was happening.</p>
                <p>• I wanted to hear everything from you.</p>
              </div>

              <p className="font-medium text-gray-900 border-l-2 border-blush-400 pl-3">
                But intention doesn&apos;t erase impact.
              </p>

              <p className="text-gray-600">
                You felt controlled. You felt unsafe. You felt like I was behaving as if I had the right to decide things for you.
              </p>

              <p className="font-semibold text-gray-800">
                And you were right to be angry.
              </p>

              <div className="space-y-1 text-sm text-gray-700 bg-lavender-50/60 p-3.5 rounded-xl border border-lavender-100">
                <p>I should have listened instead of investigating.</p>
                <p>I should have asked instead of taking.</p>
                <p>I should have trusted instead of assuming.</p>
              </div>
            </div>

            <button
              onClick={onContinue}
              className="mt-7 w-full py-3 px-4 rounded-xl bg-blush-400 hover:bg-blush-500 text-white font-medium text-sm shadow-sm transition-all flex items-center justify-center gap-2"
            >
              <span>One more thing...</span>
              <span>✨</span>
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // STEP 3: FIVE YEARS TIMELINE
    // ==========================================
    function SectionTimeline({ config, onContinue }) {
      const timelineItems = [
        {
          period: "Then",
          text: "We met. We became friends. We started becoming important to each other.",
          photo: config.photos[0]?.url,
          caption: config.photos[0]?.caption
        },
        {
          period: "Somewhere along the way",

            {choice === 'time' && (
              <div className="mt-5 p-4 rounded-2xl bg-white/5 border border-white/10 animate-fadeIn">

    }

  </script>
